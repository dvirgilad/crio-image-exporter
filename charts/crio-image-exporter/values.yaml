image:
  repository: ghcr.io/dvirgilad/crio-image-exporter
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

exporter:
  logLevel: info
  criSocket: unix:///var/run/crio/crio.sock
  criTimeout: 10s

  # Image creation timestamps. Refreshed in the background; steady-state cost
  # is near zero because creation time is immutable per image ID.
  collectImageAge: true
  imageAgeRefreshInterval: 5m

  # Cardinality controls. Per-image series are on by default.
  # imageNameFilter is a regex allowlist matched against repo tags.
  imageNameFilter: ""
  # maxImages caps per-image series; 0 is unlimited. The largest images are
  # kept, since a cap that drops the big ones defeats the purpose.
  maxImages: 0
  disablePerImage: false
  # Path the exporter serves metrics on. Also the path kube-rbac-proxy
  # authorizes, so the two cannot drift.
  metricsPath: /metrics

# Exact per-image attribution: how many bytes you reclaim by deleting an image.
# Requires mounting the container storage root read-only. Reads
# containers/storage metadata, which is an on-disk implementation detail rather
# than a stable API — hence opt-in. Without it you still get apparent sizes and
# crio_image_deduplication_ratio.
storageInspection:
  enabled: false
  root: /var/lib/containers/storage
  refreshInterval: 5m

# OpenShift SCC binding. No SCC object is created; this binds a BUILTIN SCC.
#
# Why `privileged` and not `hostmount-anyuid`: reaching crio.sock is an SELinux
# problem, not a UID one. The socket is root-owned 0660, so running as UID 0
# already satisfies the file permissions — but CRI-O's socket is labelled such
# that the default `container_t` type is denied `connectto`, and that MAC denial
# surfaces as "permission denied" even for root.
#
# Escaping `container_t` requires requesting `seLinuxOptions.type: spc_t`, and an
# SCC only permits that if its seLinuxContext strategy is RunAsAny.
# `hostmount-anyuid` inherits `restricted`'s `MustRunAs`, which *validates
# against* the allocated options and rejects a pod asking for spc_t outright.
# Among the builtin SCCs only `privileged` has `seLinuxContext: RunAsAny`.
#
# Binding `privileged` is a permission CEILING, not an instruction: the pod below
# still runs unprivileged, drops every capability, uses a read-only root
# filesystem and forbids privilege escalation. It only gains the ability to ask
# for the SELinux type it needs.
#
# The alternative — a custom SCC pinning `seLinuxOptions.type: spc_t` with
# `MustRunAs` — is tighter, at the cost of the chart creating and owning a
# cluster-scoped object. Set scc.create=false and bind your own if you prefer it.
scc:
  create: true
  name: privileged

# spc_t ("super privileged container") is the SELinux type permitted to talk to
# the container runtime. Without it the exporter cannot open crio.sock, no
# matter which UID it runs as.
podSecurityContext:
  seLinuxOptions:
    type: spc_t

securityContext:
  # crio.sock is root-owned mode 0660, so the process must run as UID 0.
  # Every other privilege is dropped.
  runAsUser: 0
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

service:
  port: 9443
  # OpenShift issues the serving certificate for this name.
  servingCertSecretName: crio-image-exporter-tls

# kube-rbac-proxy terminates TLS and authorizes scrapers against the API
# server. When disabled the exporter binds 0.0.0.0 directly over plaintext,
# which is the right choice on a non-OpenShift cluster.
kubeRBACProxy:
  enabled: true
  image: quay.io/brancz/kube-rbac-proxy:v0.18.1
  resources:
    requests: {cpu: 10m, memory: 20Mi}
    limits: {memory: 60Mi}

# Authorization for whoever scrapes this exporter. kube-rbac-proxy asks the API
# server whether the caller may GET the metrics path; without a grant the
# scraper authenticates fine and is then refused, which surfaces as a target
# stuck "down (403)" rather than as an auth error.
#
# The exporter's own ServiceAccount is always a subject of that grant, because
# the token this chart hands Prometheus via bearerTokenSecret is issued for the
# exporter's ServiceAccount -- so that, not the monitoring stack's identity, is
# who kube-rbac-proxy sees. Nothing needs listing here for the chart's own
# ServiceMonitor to work.
#
# scrapers is for additional identities: another Prometheus scraping with its
# own token, or a hand-written ServiceMonitor using bearerTokenFile. Entries
# take {name, namespace} naming a ServiceAccount.
metricsReader:
  create: true
  scrapers: []

serviceMonitor:
  enabled: true
  interval: 60s
  scrapeTimeout: 30s
  labels: {}

resources:
  requests: {cpu: 20m, memory: 40Mi}
  limits: {memory: 200Mi}

# Disk attribution matters most on control-plane nodes, so run everywhere.
tolerations:
  - operator: Exists

nodeSelector: {}
affinity: {}
priorityClassName: ""
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 10%
