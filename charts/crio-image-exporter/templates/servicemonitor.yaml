{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "crio-image-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "crio-image-exporter.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}{{- toYaml . | nindent 4 }}{{- end }}
spec:
  selector:
    matchLabels: {{- include "crio-image-exporter.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames: [{{ .Release.Namespace }}]
  endpoints:
    {{- if .Values.kubeRBACProxy.enabled }}
    - port: https
      scheme: https
      path: {{ .Values.exporter.metricsPath }}
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      # Not bearerTokenFile: OpenShift's Prometheus rejects a ServiceMonitor
      # that reads the token off disk. The Secret is created by this chart.
      bearerTokenSecret:
        name: {{ include "crio-image-exporter.fullname" . }}-token
        key: token
      tlsConfig:
        # Not caFile: a ServiceMonitor that reads the scraper's filesystem is
        # rejected. The ConfigMap is created by this chart and populated by
        # the service CA operator.
        ca:
          configMap:
            name: {{ include "crio-image-exporter.fullname" . }}-ca
            key: service-ca.crt
        serverName: {{ include "crio-image-exporter.fullname" . }}.{{ .Release.Namespace }}.svc
    {{- else }}
    - port: metrics
      scheme: http
      path: {{ .Values.exporter.metricsPath }}
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
    {{- end }}
{{- end }}
