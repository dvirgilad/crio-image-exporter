apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "crio-image-exporter.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "crio-image-exporter.labels" . | nindent 4 }}
{{- with .Values.imagePullSecrets }}
imagePullSecrets: {{- toYaml . | nindent 2 }}
{{- end }}
