{{- if .Values.scc.create }}
# Grants use of a BUILTIN SCC. No SCC object is created by this chart.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "crio-image-exporter.fullname" . }}-scc
  namespace: {{ .Release.Namespace }}
  labels: {{- include "crio-image-exporter.labels" . | nindent 4 }}
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: [{{ .Values.scc.name | quote }}]
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "crio-image-exporter.fullname" . }}-scc
  namespace: {{ .Release.Namespace }}
  labels: {{- include "crio-image-exporter.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "crio-image-exporter.fullname" . }}-scc
subjects:
  - kind: ServiceAccount
    name: {{ include "crio-image-exporter.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.kubeRBACProxy.enabled }}
---
# kube-rbac-proxy validates scraper tokens against the API server.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "crio-image-exporter.fullname" . }}-auth
  labels: {{- include "crio-image-exporter.labels" . | nindent 4 }}
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "crio-image-exporter.fullname" . }}-auth
  labels: {{- include "crio-image-exporter.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "crio-image-exporter.fullname" . }}-auth
subjects:
  - kind: ServiceAccount
    name: {{ include "crio-image-exporter.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

{{- if and .Values.kubeRBACProxy.enabled .Values.metricsReader.create }}
---
# Authorizes the scrapers to read metrics.
#
# kube-rbac-proxy runs without a config file, so it authorizes each request by
# issuing a SubjectAccessReview for the non-resource URL being requested. A
# scraper that authenticates successfully but holds no such grant gets 403, not
# 401 -- which is what a target stuck "down (403)" in Prometheus means.
#
# nonResourceURLs cannot appear in a namespaced Role, so this must be a
# ClusterRole and a ClusterRoleBinding even though it grants exactly one path.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "crio-image-exporter.fullname" . }}-metrics-reader
  labels: {{- include "crio-image-exporter.labels" . | nindent 4 }}
rules:
  - nonResourceURLs: [{{ .Values.exporter.metricsPath | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "crio-image-exporter.fullname" . }}-metrics-reader
  labels: {{- include "crio-image-exporter.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "crio-image-exporter.fullname" . }}-metrics-reader
subjects:
  # The exporter's own ServiceAccount, because the token the ServiceMonitor
  # presents is issued for it -- see the Secret in sa-token-secret.yaml. That
  # is the identity kube-rbac-proxy authenticates and then authorizes, so
  # granting the monitoring stack's ServiceAccount instead has no effect.
  - kind: ServiceAccount
    name: {{ include "crio-image-exporter.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
  {{- range .Values.metricsReader.scrapers }}
  - kind: ServiceAccount
    name: {{ .name }}
    namespace: {{ .namespace }}
  {{- end }}
{{- end }}
