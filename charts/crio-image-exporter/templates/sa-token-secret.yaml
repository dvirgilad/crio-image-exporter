{{- if and .Values.serviceMonitor.enabled .Values.kubeRBACProxy.enabled }}
# Bearer token for Prometheus to authenticate against kube-rbac-proxy.
#
# The ServiceMonitor cannot use bearerTokenFile: OpenShift's Prometheus rejects
# any ServiceMonitor that reads a token off the scraper's filesystem, so the
# token has to be handed over as a Secret reference instead. Since Kubernetes
# 1.24 ServiceAccounts no longer get a token Secret automatically, so this
# chart asks for one explicitly -- the token controller fills in the `token`
# key, which is why no data block appears here.
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: {{ include "crio-image-exporter.fullname" . }}-token
  namespace: {{ .Release.Namespace }}
  labels: {{- include "crio-image-exporter.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ include "crio-image-exporter.serviceAccountName" . }}
{{- end }}
